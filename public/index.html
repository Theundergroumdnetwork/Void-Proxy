<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020204">
    <title>Void Proxy</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scramjet/scramjet.js" defer></script>
    <script src="controller/controller.api.js" defer></script>
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <section class="launch" id="launch">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span>Void Proxy</span>
        </div>

        <form class="search" id="proxy-form" autocomplete="off">
          <label class="sr-only" for="address">Website address or search</label>
          <input id="address" name="address" type="text" inputmode="url" placeholder="Search or enter a website">
          <button type="submit">Launch</button>
        </form>

        <div class="quick-links" aria-label="Quick links">
          <button type="button" data-url="https://www.google.com">Google</button>
          <button type="button" data-url="https://www.youtube.com">YouTube</button>
          <button type="button" data-url="https://www.reddit.com">Reddit</button>
          <button type="button" data-url="https://discord.com/app">Discord</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="browser is-hidden" id="browser" aria-label="Proxy browser">
        <div class="toolbar">
          <button class="icon-button" type="button" id="home" aria-label="Home" title="Home">⌂</button>
          <button class="icon-button" type="button" id="back" aria-label="Back" title="Back">‹</button>
          <button class="icon-button" type="button" id="forward" aria-label="Forward" title="Forward">›</button>
          <button class="icon-button" type="button" id="reload" aria-label="Reload" title="Reload">↻</button>
          <form class="bar" id="toolbar-form" autocomplete="off">
            <label class="sr-only" for="toolbar-address">Current website</label>
            <input id="toolbar-address" name="toolbar-address" type="text" inputmode="url">
          </form>
          <button class="icon-button" type="button" id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        </div>
        <div class="frame-wrap" id="frame-wrap"></div>
      </section>
    </main>
  </body>
</html>
